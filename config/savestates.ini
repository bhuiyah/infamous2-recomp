# savestates.ini -- save states: the window menu's Save / Load, F5 / F9, the slot files.
# Every setting below is written out with its default: the game behaves the same with the line or
# without it. Edit a value to change it; delete the line (or put '#' in front of it) for the default.
# Found through SAVESTATES_CONFIG, then .\savestates.ini, then .\config\savestates.ini, then next to
# the exe (and <exe folder>\..\config). SAVESTATES_CFG="name=value|name=value" overrides lines for one run.
# What save states are and how to use them: docs\SAVESTATES.md.

# 0: save states are off -- nothing is armed, the Save and Load menus are greyed (as SAVESTATES=0)
enabled = 1

# the folder for the slot files, relative to the game's folder (the working directory); the title id
# is added to it: savestates\BCUS98125. SS_DIR=<folder> uses that folder as it is.
dir = savestates

# numbered slots in the Save / Load menus (1-10), besides the quick slot (F5 / F9)
slots = 10

# how slot files are compressed: xpress_huff (smallest), xpress (faster), none (largest, ~350 MB a slot)
compression = xpress_huff

# a 320-wide picture of the moment in each slot file and beside it (slot03.png): 1 on, 0 off
thumbnail = 1

# how long a save or a load waits for a moment where the whole game can stop, in seconds
give_up_s = 3

# how long a save state given at launch (SS_LOAD, tools\run.ps1 -LoadState) may wait for one, in seconds
launch_give_up_s = 60

# save states made by another build of the port (every rebuild is one) for the same game version:
# 0 loads one when this build reads its data the same way -- every section's layout, the SPU
# programs and every return address it needs agree -- with a warning: the menu tags the slot
# "(older build)" and the load says so; one that does not agree is refused with the reason.
# 1 loads only save states this build made.
build_check = 0

# 1: just before each load from the menu or a key, the game as it is is saved to undo.p3ss in the
# slot folder, and Load > Undo Last Load (Ctrl+Z) goes back to it; undoing twice swaps back.
# It costs a pause like a quick save's (~70 ms) and makes the load land ~0.3 s later. 0: no undo point.
backup_before_load = 1

# The keys are in config\input.ini [hotkeys]: quick_save (F5), quick_load (F9), save_slots
# (Ctrl+F1..F10), load_slots (Ctrl+Shift+F1..F10), undo_load (Ctrl+Z). The menu bar is display.ini
# menu_bar.

# Not yet (later milestones; these lines do nothing today):
#confirm_overwrite = 0       # ask before a save replaces a slot (the old file is kept as .bak anyway)
#pause_on_menu = 0           # hold the game while the Save / Load menu is open
