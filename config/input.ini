# inFamous 2 (ps3recomp) -- keyboard and mouse bindings
#
# Where this file is read from (the first one found wins):
#   1. the file named by the PAD_CONFIG environment variable (PAD_CONFIG=none: no file)
#   2. input.ini in the working directory
#   3. config\input.ini in the working directory   <- this file; tools\run.ps1 runs
#                                                     the game from the project root
#   4. input.ini next to infamous2.exe
# After the file, PAD_KBM="name=value|name=value" (env) overrides single lines, e.g.
#   set PAD_KBM=mouse_sensitivity=1.5|mouse_invert_y=1
# Env: PAD_NO_KEYBOARD=1 turns keyboard AND mouse input off; PAD_NO_MOUSE=1 the mouse only.
# The game prints the table it is using at startup (lines starting "[cellPad]").
#
# Every setting below is written out with its BUILT-IN DEFAULT: the game behaves the same with
# the line or without it. Edit a value to change it; delete the line (or put "# " in front of
# it) for the default again. The in-game PC Settings menu (and RecompLauncher) save to
# config\options.ini instead, whose input sections win over this file, and an update of the
# port replaces this file. Text after '#' or ';' is a comment.
#
# Bindings:  <pad input> = <key>, <key>, ...   (up to 4 keys; "none" unbinds)
#   Pad inputs: Cross Circle Square Triangle L1 R1 L2 R2 L3 R3 Start Select
#               DpadUp DpadDown DpadLeft DpadRight
#               LStickUp LStickDown LStickLeft LStickRight   (left stick, full deflection)
#               RStickUp RStickDown RStickLeft RStickRight   (right stick, full deflection)
#               Walk   (hold: the keyboard left stick moves at walk_scale)
#   Keys: A-Z, 0-9, F1-F24, Space, Enter, Esc, Tab, Backspace, CapsLock,
#         Shift LShift RShift, Ctrl LCtrl RCtrl, Alt LAlt RAlt,
#         Up Down Left Right (arrows), Insert Delete Home End PageUp PageDown,
#         Num0-Num9 NumAdd NumSub NumMul NumDiv NumDecimal,
#         Semicolon Equals Comma Minus Period Slash Grave LBracket Backslash RBracket Apostrophe,
#         LMB RMB MMB Mouse4 Mouse5 (mouse buttons), WheelUp WheelDown (one press per notch),
#         or a raw Windows virtual-key code such as 0x41.
#   A key may drive several pad inputs; the startup table notes it when one does.
#   Alt and F10 always release the mouse (see below), so avoid binding them; while Alt
#   or a Windows key is held no other key reaches the game (Alt+Tab, Alt+F4, Win+D).
#   Keys only count while the game window is in front.

[bindings]
Cross       = Space, Enter        # jump / climb; confirm in menus; Blast while aiming
Square      = F                   # melee; Grenade while aiming
Triangle    = E                   # interact / melee finisher / look; Rocket while aiming
Circle      = C, Backspace        # drop / cover / dive roll; back in menus
L1          = RMB                 # aim mode (hold)
R1          = LMB                 # lock-on; Bolt while aiming
L2          = Q, Mouse4           # electric drain (hold)
R2          = R, Mouse5           # kinetic pulse
L3          = LShift
R3          = MMB, G
Start       = Esc, P              # pause menu
Select      = Tab, M              # map
DpadUp      = Up, 1, WheelUp
DpadRight   = Right, 2
DpadDown    = Down, 3, WheelDown
DpadLeft    = Left, 4
LStickUp    = W
LStickDown  = S
LStickLeft  = A
LStickRight = D
RStickUp    = I, Num8             # camera from keys (the mouse also drives it)
RStickDown  = K, Num2
RStickLeft  = J, Num4
RStickRight = L, Num6
Walk        = LCtrl

[mouse]
# Mouse motion drives the right stick (camera). 1.0 = full stick deflection at
# 1500 counts/s (about 5 cm/s on an 800 DPI mouse); lower it for a high-DPI mouse.
mouse_sensitivity   = 1.0
mouse_sensitivity_y = 1.0         # vertical multiplier on top of mouse_sensitivity
mouse_invert_y      = 0           # 1: mouse forward looks down
# Window (ms) the mouse speed is measured over. Larger = smoother but laggier;
# the stick re-centres exactly this long after the mouse stops. 0..500.
mouse_smoothing_ms  = 50
# Least stick deflection a moving mouse produces, to get past the game's own
# stick deadzone (0..0.95). Raise it if very slow mouse motion does not turn the
# camera; lower it if small motions feel jumpy.
mouse_anti_deadzone = 0.20
# Exponent on the deflection: below 1 favours slow, precise motion; 1 = linear.
mouse_curve         = 1.0
# click: a click in the window captures the mouse (hidden, kept in the window;
#        that click is not sent to the game). Alt, F10, Alt+Tab or focus loss
#        releases it; click again to capture.
# focus: capture whenever the window gets focus.   off: no mouse input at all.
mouse_capture       = click

[options]
walk_scale            = 0.5       # left-stick deflection while Walk is held
wheel_pulse_ms        = 100       # how long one wheel notch holds its pad input
# With a controller on port 0 (any kind, see [controller]): 1 = keyboard/mouse
# merge with it (buttons combine; each stick follows the device used last, see
# below); 0 = keyboard/mouse only work while no controller is on port 0.
merge_with_controller = 1
# Merged, each stick follows the device used last: the controller's stick
# leaving its centre or any controller button gives it the camera, and a
# resting or jittering mouse then never moves it; the mouse takes the camera
# again once it has really moved (mouse_takeover counts at mouse_sensitivity
# 1, within about half a second) or on a mouse-button or camera-key press.
# Move keys against the left stick: the one pressed or moved last wins.
# With last_device_wins = 0, the old merge: any keyboard/mouse stick input
# overrides the controller's stick for that moment.
last_device_wins      = 1
mouse_takeover        = 40
keyboard              = 1
mouse                 = 1

[hotkeys]
# Window keys: save states, fullscreen and the FPS counter. They work while the
# game window is in front and never reach the game; the same commands are in the
# window's menu bar (Save, Load, View), which shows these keys next to them.
# A key combination is modifiers joined with '+' (Shift, Ctrl, Alt) and one key
# name from the list at the top. Up to two per command, with ',' between them;
# "none" unbinds. A combination is exact: F5 does not fire while Shift is held.
# Not allowed: mouse buttons, a modifier alone, and Alt+F4, Alt+Enter, Alt+Tab,
# Alt+Esc, Alt+Space, Ctrl+Esc.
# A modifier is a game key too while it is held: Left Ctrl is Walk (harmless)
# but Left Shift is L3, so saving keys avoid Shift -- a Shift pressed before the
# F-key would put an L3 press into the saved moment. Loading keys may use it.
# Save states: docs\SAVESTATES.md (slot files in savestates\BCUS98125).
# Override single lines from the environment with a "hotkey_" prefix:
#   set PAD_KBM=hotkey_quick_save=F6
quick_save  = F5
quick_load  = F9
# All ten slots at once: the key of slot 1; slot n takes the next key (F1 gives
# F2 to F10; 1 gives 2 to 9 and 0 on the number row). For one slot alone, add a
# line for save_slot_3 or load_slot_3 (and so on) after these two.
save_slots  = Ctrl+F1           # Ctrl+F1 .. Ctrl+F10
load_slots  = Ctrl+Shift+F1     # Ctrl+Shift+F1 .. Ctrl+Shift+F10
undo_load   = Ctrl+Shift+Z      # Load > Undo Last Load: back to the moment before
#                                 # the last load (press it again to come back)
fullscreen  = F11               # borderless fullscreen; Alt+Enter always works too
show_fps    = none              # the FPS counter in the corner of the picture
options     = none              # the options overlay, once there is one
menu        = none              # open the window menu from the keyboard (a
#                                 # popup in fullscreen); Alt, Alt+letter and F10 never do

[controller]
# Physical game controllers. Every line holds the BUILT-IN DEFAULT; the environment
# variables named below win over this file.
# Supported, over USB and Bluetooth: Xbox 360 / One / Series (XInput), DualShock 4,
# DualSense and DualSense Edge, Switch Pro Controller, DualShock 3 (USB, through
# DsHidMini in SDF or SXS mode or Sony's sixaxis driver), and other HID
# gamepads/joysticks. Plug in or pair at any time: the first controller is
# port 0 (player 1, the one the game reads), the next port 1, and so on; a
# controller that comes back gets its old port if it is still free. At startup
# gamepads get the first ports and joysticks/wheels the last ones. The lightbar
# / player LEDs show the port. The game prints the controller list (lines
# starting "[padhost]") at startup and on every connect/disconnect.
# A section named [controller ...] or [gamepad ...] is read by this part only.
#
controllers       = 1        # 0: ignore every physical controller (env PAD_NO_HOST=1)
backends          = all      # xinput, ds3, ds4, dualsense, switchpro, generic, all, none;
#                              # "-name" removes one, e.g. all,-xinput   (env PAD_BACKENDS)
#                              # (a remapper's Xbox copy of a PlayStation pad: prefer_physical)
deadzone          = auto     # radial stick deadzone in percent, both sticks; 0 = raw;
#                              # auto = 24 for Xbox (XInput) pads, 8 for the others
#                              # (env PAD_DEADZONE). The game adds its own on top of it;
#                              # raise it if a worn stick drifts.
deadzone_left     = auto     # left stick only
deadzone_right    = auto     # right stick (camera) only
rumble            = 100      # vibration strength in percent, 0 = off, up to 200
motion            = 1        # 0: ignore the motion sensors (DualShock 3/4, DualSense, Switch Pro);
#                              # the game then reads a pad lying still
trigger_threshold = 12       # Xbox triggers: how far (percent) L2/R2 must be pulled to count as pressed
focus_only        = 0        # 1: controllers are ignored while the game window is not in front
#                              # (env PAD_FOCUS_ONLY)
prefer_physical   = 1        # a remapper's virtual pad (DS4Windows, DualSenseX, BetterJoy and
#                              # x360ce on the ViGEm bus; SCP Toolkit; Steam Input) next to the
#                              # physical pad it copies is hidden: the physical pad is player 1,
#                              # with motion, lightbar and pressure, and the copy takes over if
#                              # it goes. 0: virtual pads are ordinary pads (an Xbox copy is then
#                              # player 1). The log says which pad is player 1 and what was
#                              # hidden (env PAD_PREFER_PHYSICAL)
log               = 0        # 1: per-controller detail in the log (env PAD_LOG)
readonly          = 0        # 1: never send anything to a controller (no rumble, lights)
#
# PlayStation pads. A button list is names joined by '+' (select l3 r3 start up
# right down left l2 r2 l1 r1 triangle circle cross square ps none).
ds4_touchpad                = select   # what a touchpad click presses
dualsense_touchpad          = select
dualsense_mute              = none     # the mic-mute button
dualsense_edge_left_paddle  = none     # DualSense Edge back buttons and Fn keys
dualsense_edge_right_paddle = none
dualsense_edge_left_fn      = none
dualsense_edge_right_fn     = none
ds4_lightbar                = port     # port (its colour), off, or a colour RRGGBB
dualsense_lightbar          = port     #   (no '#' in front of the colour: '#' starts a comment)
dualsense_player_leds       = port     # port or off
dualsense_vibration         = auto     # auto, v1, v2 or both (firmware rumble modes)
#
# Switch Pro Controller.
switch_layout   = position   # position: B = Cross, A = Circle, Y = Square, X = Triangle
#                              # (where the PlayStation buttons sit); label: A = Cross, B = Circle,
#                              # X = Square, Y = Triangle (by the printed letter)
switch_home_led = 40         # HOME button ring brightness, 0..100
#
# Other HID gamepads: the default layout suits most PlayStation-style and
# DirectInput pads. When one is opened, the log prints its active mapping as a
# "map.VID:PID = ..." line; copy it here and edit it (the syntax is in
# libs/input/pad_hid_generic.c). "ignore" leaves a device alone; it also keeps a
# wheel or flight stick from being player 1. Multi-axis devices (3D mice) are
# used only when they have a line here.
# map.0079:0006 = Triangle=b1 Circle=b2 Cross=b3 Square=b4 RX=a3 RY=a2
# map.0810:0001 = ignore
