# inFamous 2 (ps3recomp) -- display: ultrawide, window, fullscreen
#
# Where this file is read from (the first one found wins):
#   1. the file named by the DISPLAY_CONFIG environment variable (DISPLAY_CONFIG=none: no file)
#   2. display.ini in the working directory
#   3. config\display.ini in the working directory   <- this file; tools\run.ps1 runs
#                                                       the game from the project root
#   4. display.ini next to infamous2.exe
# After the file, DISPLAY_CFG="name=value|name=value" (env) overrides single lines, e.g.
#   set DISPLAY_CFG=aspect=21:9|fullscreen=1
# and these env variables override one setting each: IF2_ASPECT, IF2_HUD, IF2_LOD, IF2_FMV,
# RSX_FULLSCREEN, RSX_WINDOW, RSX_MONITOR, RSX_MENU.
# The game prints what it uses at startup: lines starting "[display]" (window, monitors)
# and "[if2-aspect]" (the wide view: W, HUD margin, LOD).
#
# Every setting below is written out with its BUILT-IN DEFAULT: the game behaves the same with
# the line or without it. Edit a value to change it; delete the line (or put "# " in front of
# it) for the default again. The in-game PC Settings menu (and RecompLauncher) save to
# config\options.ini instead, whose [display] lines win over this file, and an update of the
# port replaces this file. Text after '#' or ';' is a comment.
#
# Keys while playing: F11 or Alt+Enter = borderless fullscreen on/off (on the monitor the
# window is on). The window can be resized and maximised freely; the picture keeps its
# shape and the rest is black bars. The menu bar's keys (save states, F11, ...) are in
# input.ini, section [hotkeys].

[display]
# Field of view / screen shape. The game renders a wider view (Hor+: same vertical view,
# more on the sides) with the HUD spread to the wider screen, and the window shows it at
# that shape.
#   auto   the shape of the monitor the window opens on, if it is wider than 16:9;
#          otherwise unchanged (16:9). On a 2560x1080 monitor: 64:27.
#   off    the stock 16:9 game, whatever the monitor.
#   64:27 (2560x1080), 43:18 (3440x1440), 21:9, 32:9 (5120x1440), 16:10, 4:3,
#   any W:H, WxH (2560x1080) or a number (2.37). Clamped to 4:3 .. 32:9.
# Note: "21:9" is taken literally (2.333); a 2560x1080 monitor is 64:27 (2.370).
aspect     = auto

# HUD placement on a wide screen:
#   wide   corners of the whole screen (meters/minimap at the screen edges)
#   16:9   where they are on a 16:9 TV (the centre 16:9 area); the picture is still wide
hud        = wide

# Keep 16:9 level of detail. Objects are chosen for detail/culling by their size on
# screen; a wider view makes everything count as smaller, so without this, detail drops
# and objects disappear nearer the camera. 1 keeps the 16:9 decision for every object
# (costs a little GPU/CPU for the extra objects the wider view shows); 0 = stock rules.
lod        = 1

# Full-screen movies on a wide screen:
#   fit    the whole movie at 16:9 in the middle, black bars at the sides
#   fill   stock: the movie fills the width, top and bottom cut off
fmv        = fit

# Start in borderless fullscreen (no display mode change). F11 / Alt+Enter toggle it.
fullscreen = 0

# The menu bar above the picture: File, Save and Load (save-state slots), View (fullscreen,
# FPS counter). The window is made taller by its height, so the picture keeps its size; it
# is hidden in borderless fullscreen. 0: no menu bar (its keys in input.ini still work).
menu_bar   = 1

# The FPS counter in the top-left corner of the picture, at startup (View > Show FPS
# switches it; it shows in fullscreen too, where the title bar with the FPS is hidden).
show_fps   = 0

# Window client size: auto (720 pixels high at 100% Windows scaling, as wide as the aspect
# asks, shrunk to fit the screen), max (as large as fits the screen's work area), or WxH
# (e.g. 1920x810). Resize the window freely afterwards.
window     = auto

# Monitor the window opens on (and whose shape "aspect = auto" uses): primary, cursor (the
# one under the mouse at startup) or a number (1, 2, ... -- the "[display] monitor N" lines
# at startup list them).
monitor    = primary

# fit: picture at its own shape with black bars when the window's shape differs.
# stretch: the old behaviour -- picture stretched to the window (distorts if the window's
# shape differs). Only for troubleshooting.
present    = fit

# Real pixels on scaled (125%/150%) monitors. 0 lets Windows scale the window instead
# (blurrier); only for troubleshooting.
dpi_aware  = 1
